server:
  port: 8080

spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true # Enables automatic service routing using Eureka service IDs (e.g., /USER-SERVICE/**)
      routes:
        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        - id: catalog-service-route
          uri: lb://catalog-service
          predicates:
            - Path=/api/catalog/**

        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**, /api/cart/**

        - id: delivery-service-route
          uri: lb://delivery-service
          predicates:
            - Path=/api/deliveries/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/quick-commerce
          jwk-set-uri: http://localhost:8180/realms/quick-commerce/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true